<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Judy! 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #e11d48;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311026 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* 1. شاشة الباسورد المقسمة */
        #lock-screen {
            width: 100%;
            max-width: 780px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: row-reverse;
            animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (max-width: 768px) {
            #lock-screen {
                flex-direction: column;
                max-width: 400px;
            }
        }

        .lock-img-side {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }
        .lock-img-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .lock-form-side {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .lock-form-side h2 { color: var(--primary); font-size: 1.5rem; margin-bottom: 8px; font-weight: 900; }
        .lock-form-side p { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
        
        .password-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            letter-spacing: 3px;
            transition: 0.3s;
        }
        .password-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(225, 29, 72, 0.2); }

        .btn-main {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 18px;
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(225, 29, 72, 0.4); }

        .creator-tag {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }
        .creator-tag span {
            color: var(--accent);
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 900;
        }

        /* 2. الصفحات والسكاشن المنسابة */
        .page-container {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .birthday-header {
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .birthday-header h1 { color: var(--accent); font-size: 2.4rem; font-weight: 900; text-shadow: 0 2px 10px rgba(225,29,72,0.15); }

        /* كارت الصورة التفاعلي (لأجدع صاحبة) */
        .photo-card {
            width: 100%;
            background: var(--card-bg);
            padding: 18px;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .photo-frame {
            width: 100%;
            max-height: 420px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-frame img {
            width: 100%;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            display: block;
        }

        .photo-caption {
            margin-top: 14px;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* صندوق الرسالة والانيميشن الخاص بيه */
        #message-container {
            display: none;
            width: 100%;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #message-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .message-box {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: right;
            font-size: 1.1rem;
            line-height: 2.2;
            color: #334155;
            border-right: 8px solid var(--accent);
            width: 100%;
        }

        /* 3. معرض الصور الفخم للـ Next */
        .gallery-card {
            width: 100%;
            background: var(--card-bg);
            padding: 22px;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
        }

        .gallery-frame {
            width: 100%;
            height: 420px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gallery-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: scale(1);
        }

        .gallery-frame img.effect-hide {
            opacity: 0;
            transform: scale(0.92) rotate(-1deg);
        }

        .gallery-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            gap: 15px;
        }

            background: var(--primary);
            color: #fff;
            border: none;
            padding
